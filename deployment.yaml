apiVersion: apps/v1
kind: Deployment
metadata:
  name: longevity-coach-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: longevity-coach
  template:
    metadata:
      labels:
        app: longevity-coach
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
      - name: seed-content
        image: longevity-coach:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: LIVEON_STORAGE
          value: "sqlite"
        - name: LIVEON_DB_PATH
          value: "/home/appuser/liveon/data/content.db"
        # NCBI throttles unidentified callers first; E-utilities asks that automated
        # clients identify themselves with a contact address.
        - name: LIVEON_NCBI_EMAIL
          value: "fritzenshyllinge@gmail.com"
        # Tips come from reviewed research. Articles stay on the prose pipeline until this
        # has run unattended for a while; drop LIVEON_EVIDENCE_PIPELINE_JOBS to move them.
        - name: LIVEON_EVIDENCE_PIPELINE
          value: "1"
        - name: LIVEON_EVIDENCE_PIPELINE_JOBS
          value: "tips"
        - name: LIVEON_ROOT_PATH
          value: "/liveon"
        command: ["python", "-m", "app.scripts.seed_content"]
        volumeMounts:
        - name: liveon-data
          mountPath: /home/appuser/liveon/data
        resources:
          requests:
            cpu: "5m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
      containers:
      - name: longevity-coach
        image: longevity-coach:latest
        env:
        - name: LIVEON_STORAGE
          value: "sqlite"
        - name: LIVEON_DB_PATH
          value: "/home/appuser/liveon/data/content.db"
        # NCBI throttles unidentified callers first; E-utilities asks that automated
        # clients identify themselves with a contact address.
        - name: LIVEON_NCBI_EMAIL
          value: "fritzenshyllinge@gmail.com"
        # Tips come from reviewed research. Articles stay on the prose pipeline until this
        # has run unattended for a while; drop LIVEON_EVIDENCE_PIPELINE_JOBS to move them.
        - name: LIVEON_EVIDENCE_PIPELINE
          value: "1"
        - name: LIVEON_EVIDENCE_PIPELINE_JOBS
          value: "tips"
        - name: LIVEON_ROOT_PATH
          value: "/liveon"
        - name: LIVEON_LLM_PROVIDER
          value: "ollama"
        - name: LIVEON_OLLAMA_URL
          value: "http://host.minikube.internal:11434"
        # 32k context (phi3-medium-4k truncated multi-item feed input) and
        # markedly better structured-JSON adherence.
        - name: LIVEON_OLLAMA_MODEL
          value: "qwen2.5:14b-instruct"
        - name: LIVEON_MODEL_TEMPERATURE
          value: "0.2"
        # Ceiling on a single coach answer, so a wedged model server cannot pin a worker.
        - name: LIVEON_LLM_TIMEOUT
          value: "180"
        # The admin console stays disabled until a password exists. Enable it with:
        #   kubectl create secret generic liveon-admin --from-literal=password='<choose one>'
        - name: LIVEON_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: liveon-admin
              key: password
              optional: true
        - name: OLLAMA_HOST
          value: "host.minikube.internal:11434"
        - name: OLLAMA_BASE_URL
          value: "http://host.minikube.internal:11434"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: liveon-data
          mountPath: /home/appuser/liveon/data
        resources:
          requests:
            cpu: "10m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        # The coach now answers off the event loop, so /healthz stays responsive during
        # generation. The timeouts below still leave headroom for the CPU contention a
        # local model creates, so a slow answer can never restart the pod.
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: liveon-data
        persistentVolumeClaim:
          claimName: liveon-data
